<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이끼숲 도장판</title>
<style>
:root{
  --bg:#f4f4ee; --card:#fffefa; --ink:#1f2d25; --sub:#6b766f; --line:#e3e6df;
  --moss:#2f4a3c; --moss2:#527058; --gold:#d8b45a; --soft:#eaf0ea; --empty:#f7f8f4;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141a16; --card:#1c241f; --ink:#eef2ec; --sub:#9aa89f; --line:#2c372f; --soft:#26332b; --empty:#202a24; --moss2:#6f9378}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:884px;margin:0 auto;padding:8px 16px 48px}
header{background:linear-gradient(135deg,#2f4a3c,#527058);color:#fff;border-radius:22px;padding:28px;margin-bottom:16px}
header small{letter-spacing:.12em;font-size:12px;opacity:.8}
header h1{margin:4px 0 6px;font-size:40px;line-height:1.15}
header p{margin:0;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stats .card{margin:0;padding:16px 18px}
.stats span{font-size:13px;color:var(--sub)}
.stats b{display:block;font-size:26px}
h2{margin:0 0 14px;font-size:19px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;background:var(--soft);color:var(--moss2);padding:3px 10px;border-radius:99px;white-space:nowrap}
.stamps{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin:8px 0 22px}
.st{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);background:var(--empty);display:grid;place-items:center;font-size:13px;color:var(--sub);position:relative}
.st.ms{border:2.5px solid var(--gold);border-style:solid}
.st.on{background:var(--moss);border-color:var(--moss);color:#fff;font-weight:700;animation:pop .35s}
.st.on.ms{box-shadow:0 0 0 2px var(--gold)}
.st i{position:absolute;bottom:-18px;font-style:normal;font-size:11px;color:var(--sub);white-space:nowrap}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.st.on{animation:none}}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:14px}
.bar div{height:100%;background:var(--gold);transition:width .3s}
.ms-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.ms-list div{border:1px solid var(--line);background:var(--empty);border-radius:12px;padding:10px 12px;font-size:14px}
.ms-list div.done{border-color:var(--gold)}
.ms-list small,.note{color:var(--sub);font-size:13px}
.note{margin:12px 0 0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.primary{background:var(--moss2);color:#fff;padding:12px 18px;font-weight:700}
.primary:hover{filter:brightness(1.08)}
.ghost{background:var(--soft);color:var(--ink);padding:10px 16px;font-weight:600}
.small{background:none;color:var(--sub);padding:2px 6px;font-size:12px;text-decoration:underline}
.board{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
.board.cur{border-color:var(--moss2)}
.board .meta{font-size:13px;color:var(--sub);margin:0 0 10px}
.board .stamps{margin:0 0 4px;gap:6px}
.board .st{font-size:11px}
.log{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.log li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
@media (max-width:640px){
  header h1{font-size:30px}
  .stats b{font-size:21px}
  .stamps{grid-template-columns:repeat(4,1fr);row-gap:26px}
  .ms-list,.form{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <small>MUSICAL · MOSS FOREST</small>
    <h1>이끼숲 도장판</h1>
    <p>관극을 기록하면 도장이 차곡차곡 쌓여요.</p>
  </header>

  <section class="stats">
    <div class="card"><span>현재 도장</span><b id="sCur">0 / 8</b></div>
    <div class="card"><span>다음 혜택까지</span><b id="sNext">-</b></div>
    <div class="card"><span>등록한 관극</span><b id="sTotal">0회</b></div>
  </section>

  <section class="card">
    <div class="top"><h2>진행 중인 도장판</h2><span class="tag" id="curName"></span></div>
    <div id="curStamps" class="stamps"></div>
    <div class="bar"><div id="bar"></div></div>
    <div class="ms-list" id="msList"></div>
    <p class="note">도장 1개는 이끼숲 관극 1회로 계산해요. 8개를 채우면 도장판이 종료되고, 새 도장판을 시작할 수 있어요.</p>
  </section>

  <section class="card">
    <h2>관극 기록 추가</h2>
    <div class="form">
      <div><label for="fDate">관극 날짜</label><input id="fDate" type="date"></div>
      <div><label for="fRound">회차 / 메모 (선택)</label><input id="fRound" placeholder="예: 19:30 / 낮공"></div>
      <div class="full"><label for="fNote">기록 메모 (선택)</label><input id="fNote" placeholder="함께 본 캐스팅이나 간단한 메모"></div>
      <div class="full"><button class="primary" id="add">관극 기록 추가하고 도장 찍기</button></div>
    </div>
    <p class="note">이 사이트는 이끼숲 전용이에요. 이끼숲 관극 1회마다 도장 1개를 적립합니다.</p>
  </section>

  <section class="card">
    <div class="top"><h2>도장판 관리</h2><button class="ghost" id="newBoard">새 도장판 시작</button></div>
    <p class="note">기록은 이 브라우저에 저장돼요. 브라우저 데이터를 지우면 사라지니 주의하세요.</p>
    <div id="boards"></div>
  </section>
</div>

<script>
const MAX = 8;
const MILES = [{n:4, t:"40% 할인쿠폰", s:"중간 혜택", l:"40%"},
               {n:6, t:"50% 할인쿠폰", s:"중간 혜택", l:"50%"},
               {n:8, t:"폴라", s:"최종 혜택", l:"폴라"}];
const KEY = "mossforest-stamp-v1";
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!state || !state.boards) state = {boards:[{id:1, visits:[], ended:false}]};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const active = () => state.boards.find(b => !b.ended);

function stampsHTML(count, labels) {
  let h = "";
  for (let i = 1; i <= MAX; i++) {
    const m = MILES.find(x => x.n === i);
    h += `<div class="st${i <= count ? " on" : ""}${m ? " ms" : ""}">${i}${labels && m ? `<i>${m.l}</i>` : ""}</div>`;
  }
  return h;
}

function render() {
  const cur = active();
  const count = cur ? cur.visits.length : 0;
  const total = state.boards.reduce((a, b) => a + b.visits.length, 0);
  const next = MILES.find(m => m.n > count);

  $("sCur").textContent = cur ? `${count} / ${MAX}` : "-";
  $("sNext").textContent = !cur ? "새 판 필요" : next ? `${next.n - count}개` : "달성";
  $("sTotal").textContent = `${total}회`;
  $("curName").textContent = cur ? `이끼숲 도장판 ${cur.id}` : "진행 중인 판 없음";
  $("curStamps").innerHTML = stampsHTML(count, true);
  $("bar").style.width = `${count / MAX * 100}%`;
  $("msList").innerHTML = MILES.map(m =>
    `<div class="${count >= m.n ? "done" : ""}"><b>${m.n}개 · ${m.t}</b><br><small>${m.s}${count >= m.n ? " ✓ 달성" : ""}</small></div>`).join("");
  $("add").disabled = !cur;

  $("boards").innerHTML = [...state.boards].reverse().map(b => {
    const c = b.visits.length;
    const got = MILES.filter(m => c >= m.n).length;
    const log = b.visits.map((v, i) =>
      `<li><span>${i + 1}회 · ${esc(v.date)}${v.round ? " · " + esc(v.round) : ""}${v.note ? " — " + esc(v.note) : ""}</span>
       <button class="small" data-del="${b.id}:${i}">삭제</button></li>`).join("");
    return `<div class="board${b.ended ? "" : " cur"}">
      <div class="top"><b>이끼숲 도장판 ${b.id}</b><span class="tag">${b.ended ? "종료" : "진행 중"}</span></div>
      <p class="meta">${c}/${MAX}개 · 혜택 ${got}개 수령</p>
      <div class="stamps">${stampsHTML(c, false)}</div>
      ${log ? `<ul class="log">${log}</ul>` : ""}
      ${!b.ended ? `<button class="small" data-end="${b.id}">이 도장판 종료하기</button>` : ""}
    </div>`;
  }).join("");
}

$("add").onclick = () => {
  const cur = active();
  const date = $("fDate").value;
  if (!cur) return;
  if (!date) { $("fDate").focus(); return; }
  cur.visits.push({date, round:$("fRound").value.trim(), note:$("fNote").value.trim()});
  if (cur.visits.length >= MAX) cur.ended = true;
  $("fRound").value = $("fNote").value = "";
  save(); render();
};

$("newBoard").onclick = () => {
  const cur = active();
  if (cur && !confirm("진행 중인 도장판을 종료하고 새로 시작할까요?")) return;
  if (cur) cur.ended = true;
  state.boards.push({id:Math.max(...state.boards.map(b => b.id)) + 1, visits:[], ended:false});
  save(); render();
};

$("boards").onclick = e => {
  const d = e.target.dataset;
  if (d.del) {
    const [id, i] = d.del.split(":").map(Number);
    const b = state.boards.find(x => x.id === id);
    if (b && confirm("이 관극 기록을 삭제할까요?")) { b.visits.splice(i, 1); save(); render(); }
  }
  if (d.end) {
    const b = state.boards.find(x => x.id === +d.end);
    if (b && confirm("이 도장판을 종료할까요?")) { b.ended = true; save(); render(); }
  }
};

const t = new Date();
$("fDate").value = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
render();
</script>
</body>
</html>
